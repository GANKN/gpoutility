<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gankn | utility</title>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tu hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-theme">

    <div class="custom-cursor"></div>

    <!-- Pantalla de inicio -->
    <div id="start-screen">
        <div id="start-text"></div>
    </div>

    <!-- Video de fondo (Cambia la URL por tu propio video si quieres) -->
    <video id="background" class="video-background" autoplay loop muted playsinline webkit-playsinline>
        <source src="https://cdn.pixabay.com/video/2020/07/30/45961-444720970_large.mp4" type="video/mp4">
    </video>

    <div class="glitch-overlay"></div>
    <div id="hacker-overlay" class="hidden"></div>
    <div id="snow-overlay" class="hidden"></div>

    <!-- PERFIL DE GANKN -->
    <div id="profile-block" class="hidden">
        <div class="profile-header">
            <div class="profile-container">
                <!-- CAMBIA ESTA URL POR TU FOTO -->
                <img src="https://i.pinimg.com/736x/8a/8c/3b/8a8c3b0b7d0b4b3d4b3d4b3d4b3d4b3d.jpg" alt="gankn" class="profile-picture">
            </div>
            <div class="profile-info">
                <div class="name-and-badges">
                    <div id="profile-name">gankn</div>
                    <div class="badge-group">
                        <!-- Iconos en lugar de imágenes locales -->
                        <i class="badge fa-solid fa-circle-check" title="Verified"></i>
                        <i class="badge fa-solid fa-code" title="Developer"></i>
                        <i class="badge fa-solid fa-crown" title="Owner"></i>
                        <i class="badge fa-solid fa-skull" title="Hated"></i>
                    </div>
                </div>
                <div id="profile-bio"></div>
            </div>
        </div>
        
        <div class="bio-separator"></div>
        
        <div class="profile-footer">
            <div class="social-links">
                <a href="https://github.com/gankn" class="social-icon" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-spotify"></i></a>
            </div>
            <div class="visitor-counter">
                <i class="fa-solid fa-eye visitor-icon"></i>
                <span id="visitor-count">0</span>
            </div>
        </div>
    </div>

    <!-- BLOQUE DE SKILLS (Oculto) -->
    <div id="skills-block" class="hidden">
        <h2 class="skills-title">Programming Skills</h2>
        <div class="skill">
            <div class="skill-name"><span>Python</span><span>87%</span></div>
            <div class="skill-bar-container"><div id="python-bar" class="skill-bar"></div></div>
        </div>
        <div class="skill">
            <div class="skill-name"><span>C++</span><span>75%</span></div>
            <div class="skill-bar-container"><div id="cpp-bar" class="skill-bar"></div></div>
        </div>
        <div class="skill">
            <div class="skill-name"><span>C#</span><span>80%</span></div>
            <div class="skill-bar-container"><div id="csharp-bar" class="skill-bar"></div></div>
        </div>
    </div>

    <div id="results-button-container" class="hidden">
        <button id="results-theme">View Results</button>
        <div id="results-hint" class="hidden">Click again to return to profile</div>
    </div>

    <!-- Botones de los 5 Temas -->
    <div class="controls">
        <div id="home-theme" class="theme-button">1</div>
        <div id="hacker-theme" class="theme-button">2</div>
        <div id="rain-theme" class="theme-button">3</div>
        <div id="anime-theme" class="theme-button">4</div>
        <div id="car-theme" class="theme-button">5</div>
    </div>

    <!-- Controles de Audio -->
    <div class="top-controls">
        <div class="volume-control">
            <svg id="volume-icon" class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.3">
        </div>
        <div class="transparency-control">
            <svg class="transparency-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <input id="transparency-slider" class="transparency-slider" type="range" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <!-- Audios (Puedes cambiar los src por tus propios archivos mp3) -->
    <audio id="background-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3"></audio>
    <audio id="hacker-music" loop muted><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mp3"></audio>
    <audio id="rain-music" loop muted><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mp3"></audio>
    <audio id="anime-music" loop muted><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" type="audio/mp3"></audio>
    <audio id="car-music" loop muted><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" type="audio/mp3"></audio>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Tu Script -->
    <script src="script.js"></script>
</body>
</html>
