<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* Reset y fondo oscuro */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f0f;
            /* Un gradiente sutil de fondo para darle profundidad */
            background-image: radial-gradient(circle at center, #1a1a20 0%, #0f0f0f 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }

        /* Título superior */
        .page-title {
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .page-title span {
            color: #00FFFF; /* Cyan brillante */
        }

        /* El Grid del Panal */
        .honeycomb {
            display: grid;
            /* 5 columnas de 160px de ancho */
            grid-template-columns: repeat(5, 160px);
            /* Filas de 150px de alto para el traslape perfecto */
            grid-auto-rows: 150px;
            gap: 10px;
        }

        /* Contenedor de cada Hexágono */
        .hex {
            position: relative;
            width: 160px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
        }

        /* Efecto Hover */
        .hex:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.3));
            z-index: 10;
        }

        /* El fondo gris del borde */
        .hex-bg {
            position: absolute;
            inset: 0;
            background-color: #4a4a4a;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            z-index: 1;
            transition: background-color 0.2s ease;
        }

        /* Cambia el color del borde al pasar el mouse */
        .hex:hover .hex-bg {
            background-color: #00FFFF;
        }

        /* El fondo oscuro interior */
        .hex-bg::before {
            content: '';
            position: absolute;
            inset: 3px; /* Grosor del borde */
            background-color: #1a1a1f; /* Un tono más oscuro y azulado */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* La imagen del icono */
        .hex-icon {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        /* El texto */
        .hex-text {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
            z-index: 2;
            width: 100%;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        /* =========================================
           POSICIONAMIENTO EXACTO EN EL PANAL
           ========================================= */
        .races             { grid-column: 2; grid-row: 1; }
        .fishing           { grid-column: 4; grid-row: 1; }
        
        .swords            { grid-column: 1; grid-row: 2; }
        .islands           { grid-column: 3; grid-row: 2; }
        .fighting-styles   { grid-column: 5; grid-row: 2; }
        
        .fruits            { grid-column: 2; grid-row: 3; }
        .bosses            { grid-column: 4; grid-row: 3; }
        
        .accessories       { grid-column: 1; grid-row: 4; }
        .battle-royale     { grid-column: 3; grid-row: 4; }
        .traveling-merchant{ grid-column: 5; grid-row: 4; }
        
        .npcs              { grid-column: 2; grid-row: 5; }
        .abilities         { grid-column: 4; grid-row: 5; }

        /* Responsive para celulares */
        @media (max-width: 900px) {
            .honeycomb { transform: scale(0.7); margin-bottom: -100px; }
            .page-title { font-size: 1.8rem; padding: 0 20px; }
        }
        @media (max-width: 600px) {
            .honeycomb { transform: scale(0.5); margin-bottom: -200px; }
        }
    </style>
</head>
